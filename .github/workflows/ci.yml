name: CI

on:
  push:
    branches: ["main", "rebuild/**"]
  pull_request:
    branches: ["main", "rebuild/**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sourcehero
          POSTGRES_PASSWORD: sourcehero_dev
          POSTGRES_DB: sourcehero
        ports:
          - 54339:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ensure test databases
        env:
          DATABASE_URL: postgresql+psycopg://sourcehero:sourcehero_dev@127.0.0.1:54339/sourcehero
          TEST_DATABASE_URL: postgresql+psycopg://sourcehero:sourcehero_dev@127.0.0.1:54339/sourcehero_test
        run: |
          cp .env.example .env
          uv run python scripts/wait_for_db.py
          uv run python scripts/db_ensure_databases.py
          uv run alembic upgrade head

      - name: Run backend check
        run: make check-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install python dependencies for export_openapi
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: dashboard-web
        run: npm ci --no-audit --no-fund

      - name: Run web check
        run: make web-check
