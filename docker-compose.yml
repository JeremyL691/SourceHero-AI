services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sourcehero-v2-db
    environment:
      POSTGRES_USER: sourcehero
      POSTGRES_PASSWORD: sourcehero_dev
      POSTGRES_DB: sourcehero
    ports:
      - "127.0.0.1:${DB_PORT:-54339}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcehero -d sourcehero"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    profiles: ["s3"]
    image: minio/minio
    container_name: sourcehero-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata: {}
  miniodata: {}