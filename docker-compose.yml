# SourceHero v2.
#
#   docker compose up -d db              # just the database, for local development
#   docker compose --profile app up -d   # the whole application
#
# Host ports come from .env (see scripts/ports.sh), because other projects on this
# machine already hold 8000 and 54329.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sourcehero-v2-db
    environment:
      POSTGRES_USER: sourcehero
      POSTGRES_PASSWORD: sourcehero_dev
      POSTGRES_DB: sourcehero
    ports:
      - "127.0.0.1:${DB_PORT:-54339}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourcehero -d sourcehero"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    profiles: ["s3"]
    image: minio/minio
    container_name: sourcehero-v2-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sourcehero-v2-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the network the database is `db:5432` -- never the host-mapped port,
      # which may be a different number on every machine.
      DATABASE_URL: postgresql+psycopg://sourcehero:sourcehero_dev@db:5432/sourcehero
      SOURCEHERO_ENV: production
      # Required, with no default: the app refuses to boot in production with the
      # shipped secret, and a container that dies on start with a validation error is
      # a worse way to learn that than a message from compose.
      SOURCEHERO_SECRET_KEY: ${SOURCEHERO_SECRET_KEY:?set SOURCEHERO_SECRET_KEY in .env before starting the app profile}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
      CORS_ORIGINS: http://127.0.0.1:${WEB_PORT:-3787},http://localhost:${WEB_PORT:-3787}
      PUBLIC_WEB_URL: http://127.0.0.1:${WEB_PORT:-3787}
    ports:
      - "127.0.0.1:${API_PORT:-8787}:8000"
    # Migrations run before the server starts: an app whose schema is behind its code
    # fails on the first request, not at boot, which is a much worse time to find out.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sourcehero-v2-worker
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://sourcehero:sourcehero_dev@db:5432/sourcehero
      SOURCEHERO_ENV: production
      # Required, with no default: the app refuses to boot in production with the
      # shipped secret, and a container that dies on start with a validation error is
      # a worse way to learn that than a message from compose.
      SOURCEHERO_SECRET_KEY: ${SOURCEHERO_SECRET_KEY:?set SOURCEHERO_SECRET_KEY in .env before starting the app profile}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hashing}
    command: ["python", "-m", "app.jobs.worker", "--concurrency", "2"]

  web:
    profiles: ["app"]
    build:
      context: ./dashboard-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${API_PORT:-8787}
    container_name: sourcehero-v2-web
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:${WEB_PORT:-3787}:3000"

volumes:
  pgdata: {}
  miniodata: {}
