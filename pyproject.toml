[project]
name = "sourcehero-ai"
version = "0.7.0"
description = "Research companion with cited answers from your own sources."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "fastapi>=0.111.0",
  "feedparser>=6.0.11",
  "pandas>=2.2.2",
  "pydantic>=2.7.0",
  "openai>=1.0.0",
  "pypdf>=4.2.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "requests>=2.32.0",
  "sqlalchemy>=2.0.30",
  "uvicorn>=0.30.0",
  "psycopg2-binary>=2.9.9",
  "boto3>=1.34.0",
  "pyjwt>=2.8.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.2.0",
  "alembic>=1.13.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "dashboard*", "evals*", "tests*"]
