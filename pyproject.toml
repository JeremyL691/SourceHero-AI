[project]
name = "sourcehero-ai"
version = "2.2.0.dev0"
description = "Claim-level, time-aware, verifiable research knowledge system."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart",
  # config
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv",
  # db
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  # http
  "httpx>=0.27",
  # extraction
  "trafilatura>=1.12",
  "beautifulsoup4",
  "feedparser",
  "pypdf>=4.2",
  # nlp
  "jieba>=0.42",
  "rapidfuzz>=3.9",
  "numpy",
  # vector / rerank
  "fastembed>=0.4",
  # security
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=42",
  # templates
  "jinja2>=3.1",
  # mcp
  "mcp>=2.0",
  # serialization / parsing
  "pyyaml>=6.0",
  # storage
  "boto3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout",
  "respx>=0.21",
  "ruff>=0.6",
  "reportlab",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --timeout=120"
markers = [
  "network: needs internet",
  "model: downloads ML models",
  "slow: >10s",
  "db: needs a reachable Postgres",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008: `Depends(...)` in a parameter default is how FastAPI declares dependencies.
# Restricting the exception to these files keeps the rule active everywhere else.
"app/api/deps.py" = ["B008"]
"app/api/routers/*.py" = ["B008"]
"tests/*.py" = ["B008"]

[tool.setuptools.packages.find]
include = ["app*"]